<VirtualHost *:80>
    ServerName clipartweb.1tlt.ru
    Redirect permanent / https://clipartweb.1tlt.ru/
</VirtualHost>

<VirtualHost *:443>
    ServerName clipartweb.1tlt.ru
    DocumentRoot /ssd/www/clipartweb/backend/public

    # SSL (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/clipartweb.1tlt.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/clipartweb.1tlt.ru/privkey.pem

    # Laravel backend (API)
    <Directory /ssd/www/clipartweb/backend/public>
        AllowOverride All
        Require all granted
        Options -Indexes

        # Rewrite для Laravel
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>

    # API маршруты обрабатываются Laravel
    <LocationMatch "^/api/">
        ProxyPass !
    </LocationMatch>

    # Frontend (React SPA) — все не-API маршруты
    # Вариант 1: React build в backend/public/app/
    Alias /assets /ssd/www/clipartweb/frontend/dist/assets
    <Directory /ssd/www/clipartweb/frontend/dist/assets>
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </Directory>

    # SPA fallback — если файл не найден и не /api, отдаём index.html
    RewriteEngine On

    # Не трогать API запросы
    RewriteCond %{REQUEST_URI} ^/api [NC]
    RewriteRule ^ - [L]

    # Не трогать существующие файлы
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteRule ^ - [L]

    # Не трогать assets
    RewriteCond %{REQUEST_URI} ^/assets [NC]
    RewriteRule ^ - [L]

    # Всё остальное — SPA
    RewriteRule ^ /ssd/www/clipartweb/frontend/dist/index.html [L]

    # Безопасность
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # CORS для API
    <LocationMatch "^/api/">
        Header always set Access-Control-Allow-Origin "https://clipartweb.1tlt.ru"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With"
        Header always set Access-Control-Allow-Credentials "true"
    </LocationMatch>

    # Лимит загрузки файлов (500MB)
    LimitRequestBody 524288000

    # Логи
    ErrorLog /var/log/apache2/clipartweb-error.log
    CustomLog /var/log/apache2/clipartweb-access.log combined
</VirtualHost>
