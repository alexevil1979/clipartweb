[program:clipartweb-queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php /ssd/www/clipartweb/backend/artisan queue:work database --queue=render-high --sleep=3 --tries=2 --timeout=3600 --max-jobs=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/ssd/www/clipartweb/queue/worker-high.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:clipartweb-queue-low]
process_name=%(program_name)s_%(process_num)02d
command=php /ssd/www/clipartweb/backend/artisan queue:work database --queue=render-low --sleep=5 --tries=2 --timeout=3600 --max-jobs=5
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/ssd/www/clipartweb/queue/worker-low.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[group:clipartweb-workers]
programs=clipartweb-queue-high,clipartweb-queue-low
priority=999
